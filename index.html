      (function(){
        try {
          var THEMES = ['tl-dark','tl-navy','tl-matrix','tl-amber','tl-light'];
          var t = localStorage.getItem('tl_theme');

          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
